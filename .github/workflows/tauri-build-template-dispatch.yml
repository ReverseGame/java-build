name: Tauri CI Dispatch

on:
  workflow_call:
    inputs:
      buildStage:
        required: true
        type: string
      nodeVersion:
        required: false
        type: string
        default: "lts/*"
      tauriVersion:
        required: false
        type: string
        default: "1"
      awsRegion:
        required: true
        type: string
      buildFeishuWebhook:
        required: false
        type: string
      releaseFeishuWebhook:
        required: false
        type: string
      bucket:
        required: true
        type: string
      useAppToken:
        required: false
        type: boolean
        default: false
        description: "true=使用 GitHub App token (需传 appId/appPrivateKey)；false=沿用 patToken"
      tokenRepositories:
        required: false
        type: string
        default: ""
        description: "App token 需要访问的 repo 列表（逗号或换行分隔， 省略则仅当前 repo）。"
      tokenOwner:
        required: false
        type: string
        default: ""
        description: "App token 所属 org/user，省略则用当前 repo 的 owner"
    secrets:
      awsAccessKey:
        required: true
      awsSecretKey:
        required: true
      tauriPrivateKey:
        required: true
      tauriKeyPassword:
        required: true
      patToken:
        required: false
        description: "PAT token，useAppToken=false 时必填（默认方案）"
      appId:
        required: false
        description: "GitHub App ID，useAppToken=true 时必填"
      appPrivateKey:
        required: false
        description: "GitHub App private key (PEM)，useAppToken=true 时必填"

jobs:
  pr_new_version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token (可选)
        if: ${{ inputs.useAppToken }}
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.appId }}
          private-key: ${{ secrets.appPrivateKey }}
          owner: ${{ inputs.tokenOwner }}
          repositories: ${{ inputs.tokenRepositories }}

      - name: Resolve token source (日志)
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "::notice::使用 GitHub App token (App ID=${{ secrets.appId }})"
          elif [ "${{ inputs.useAppToken }}" = "true" ]; then
            echo "::warning::App token 获取失败，自动回退到 patToken"
          else
            echo "::notice::使用 patToken (未启用 useAppToken)"
          fi
          if [ -z "${{ steps.app-token.outputs.token }}" ] && [ -z "${{ secrets.patToken }}" ]; then
            echo "::error::App token 和 patToken 都为空，无法继续"
            exit 1
          fi

      - name: Echo client_payload
        run: |
          echo "client_payload sha: ${{ github.event.client_payload.sha }}"
          echo "client_payload pr_title: ${{ github.event.client_payload.message }}"
          echo "client_payload repository: ${{ github.event.client_payload.repository }}"
      - name: Checkout code (检出代码)
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.patToken }}
          submodules: recursive
          fetch-depth: 0
      - name: show dir list
        run: ls -a
      - name: Update submodule SHAs
        id: update_submodule
        run: |
          echo $(pwd)
          echo "master SHA: $(git rev-parse HEAD)"
          repository="${{ github.event.client_payload.repository }}"
          echo "Updating repository: $repository"
          repo_name=$(basename $repository)
          echo "Local submodule path: $repo_name"
          echo "repo_name=$repo_name" >> $GITHUB_OUTPUT
          git -C $repo_name fetch origin ${{ github.event.client_payload.sha }}
          git -C $repo_name checkout ${{ github.event.client_payload.sha }} --force
          cd $repo_name
          git rev-parse HEAD

      - name: Set PR body based on repository
        id: pr_body
        env:
          PR_BODY_MAP: ${{ vars.PR_BODY_MAP }}
        run: |
          repo_name="${{ steps.update_submodule.outputs.repo_name }}"
          if [ -n "$PR_BODY_MAP" ]; then
            body=$(printf '%s' "$PR_BODY_MAP" | jq -r --arg name "$repo_name" '.[$name] // "优化已知问题"')
          else
            body="优化已知问题"
          fi
          echo "body=$body" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          token: ${{ steps.app-token.outputs.token || secrets.patToken }}
          add-paths: |
            ${{ steps.update_submodule.outputs.repo_name }}
          commit-message: "[create-pull-request] ${{ github.event.client_payload.message }}"
          title: "[create-pull-request] ${{ github.event.client_payload.message }}"
          body: "${{ steps.pr_body.outputs.body }}"

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --admin --merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.patToken }}

      - name: post success message
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ inputs.buildFeishuWebhook }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: PR 合并成功
                content:
                - - tag: text
                    text: 'PR链接: '
                  - tag: a
                    text: 点击跳转
                    href: ${{ steps.cpr.outputs.pull-request-url }}
