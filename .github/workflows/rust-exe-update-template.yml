name: Rust CI

on:
  workflow_call:
    inputs:
      projectName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      buildStage:
        required: true
        type: string
        default: ""
      tencentRegion:
        required: true
        type: string
      bucket:
        required: true
        type: string
      usePack:
        required: false
        type: string
        default: 'false'
      retries:
        required: false
        type: number
        default: 3
    secrets:
      webhookFeishu:
        required: true
      TENCENT_SECRET_ID:
        required: false
      TENCENT_SECRET_KEY:
        required: false
      updateApi:
        required: true

jobs:
  build_rust:
    runs-on: rust-windows

    steps:
      - name: post messasge
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 开始构建
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Checkout repository
        uses: actions/checkout@v4
      #      - name: Update Rust (更新 Rust)
      #        run: |
      #          rustup update
      - name: get cargo version
        id: version
        run: |
          $version = Select-String -Path cli/Cargo.toml -Pattern '^version = "(.*)"$' | ForEach-Object { $_.Matches.Groups[1].Value }
          echo "::set-output name=version::$($version)"
          Write-Output "version=$($version)" >> $Env:GITHUB_OUTPUT
        shell: powershell

      - name: test output
        run: |
          Write-Host "version = " ${{ steps.version.outputs.version }}
        shell: powershell
      - name: Build Product Release
        if: inputs.buildStage == 'product'
        run: |
          $env:RUSTFLAGS='--cfg env="product"';cargo build --release --target-dir ../target/${{ inputs.buildStage }}
      - name: Build Beta Release
        if: inputs.buildStage == 'beta'
        run: |
          $env:RUSTFLAGS='--cfg env="beta"';cargo build --release --target-dir ../target/${{ inputs.buildStage }}
      - name: Build Release
        if: inputs.buildStage != 'beta' && inputs.buildStage != 'product'
        run: |
          cargo build --release --target-dir ../target/${{ inputs.buildStage }}
      - name: Pack product release (if enabled)
        if: inputs.usePack == 'true' && inputs.buildStage == 'product'
        shell: powershell
        run: |
          $packedDir = "..\target\${{ inputs.buildStage }}\release\packed"
          if (-not (Test-Path $packedDir)) {
            New-Item -ItemType Directory -Force -Path $packedDir | Out-Null
          }
          $input = "..\target\${{ inputs.buildStage }}\release\${{ inputs.packageName }}.exe"
          $output = "$packedDir\${{ inputs.packageName }}.exe"
          Write-Host "Packing: $input -> $output"
          .\pack.exe --input $input --output $output
          if (-not (Test-Path $output)) {
            Write-Host "::error::Pack failed: output file not produced"
            exit 1
          }
          $sizeOrig = (Get-Item $input).Length
          $sizePacked = (Get-Item $output).Length
          Write-Host "Original size: $sizeOrig bytes; Packed size: $sizePacked bytes"
      - name: Get target parent path
        id: target_parent_path
        shell: powershell
        run: |
          $parentPath = Split-Path -Parent (Get-Location).Path
          echo "PARENT_PATH=$parentPath" >> $env:GITHUB_OUTPUT

      - name: Upload unpacked via coscli
        if: inputs.usePack != 'true' && inputs.buildStage != 'product'
        shell: powershell
        run: |
          $secretId = '${{ secrets.TENCENT_SECRET_ID }}'
          $secretKey = '${{ secrets.TENCENT_SECRET_KEY }}'
          $region = '${{ inputs.tencentRegion }}'
          $bucket = '${{ inputs.bucket }}'
          $key = 'windows/${{ inputs.buildStage }}/unpacked/${{ inputs.packageName }}-${{ github.ref_name }}-${{ github.sha }}.exe'
          $local = "${{ steps.target_parent_path.outputs.PARENT_PATH }}\target\${{ inputs.buildStage }}\release\${{ inputs.packageName }}.exe"
          .\coscli.exe --secret-id $secretId --secret-key $secretKey --region $region --bucket $bucket --key $key --local $local --retries ${{ inputs.retries }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }    

      - name: Upload product unpacked via coscli
        if: inputs.usePack == 'true' && inputs.buildStage != 'product'
        shell: powershell
        run: |
          $secretId = '${{ secrets.TENCENT_SECRET_ID }}'
          $secretKey = '${{ secrets.TENCENT_SECRET_KEY }}'
          $region = '${{ inputs.tencentRegion }}'
          $bucket = '${{ inputs.bucket }}'
          $key = '$/windows/${{ inputs.buildStage }}/${{ inputs.packageName }}-${{ github.ref_name }}-${{ github.sha }}.exe'
          $local = "${{ steps.target_parent_path.outputs.PARENT_PATH }}\target\${{ inputs.buildStage }}\release\packed\${{ inputs.packageName }}.exe"
          .\coscli.exe --secret-id $secretId --secret-key $secretKey --region $region --bucket $bucket --key $key --local $local --retries ${{ inputs.retries }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Product unpacked via coscli
        if: inputs.buildStage == 'product'
        shell: powershell
        run: |
          $secretId = '${{ secrets.TENCENT_SECRET_ID }}'
          $secretKey = '${{ secrets.TENCENT_SECRET_KEY }}'
          $region = '${{ inputs.tencentRegion }}'
          $bucket = '${{ inputs.bucket }}'
          $key = 'windows/release/unpacked-${{ github.sha }}/${{ inputs.packageName }}-${{ github.ref_name }}.exe'
          $local = "${{ steps.target_parent_path.outputs.PARENT_PATH }}\target\${{ inputs.buildStage }}\release\${{ inputs.packageName }}.exe"
          .\coscli.exe --secret-id $secretId --secret-key $secretKey --region $region --bucket $bucket --key $key --local $local --retries ${{ inputs.retries }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload product packed via coscli
        if: inputs.usePack == 'true' && inputs.buildStage == 'product'
        shell: powershell
        run: |
          $secretId = '${{ secrets.TENCENT_SECRET_ID }}'
          $secretKey = '${{ secrets.TENCENT_SECRET_KEY }}'
          $region = '${{ inputs.tencentRegion }}'
          $bucket = '${{ inputs.bucket }}'
          $key = 'windows/release/${{ inputs.packageName }}-${{ github.ref_name }}.exe'
          $local = "${{ steps.target_parent_path.outputs.PARENT_PATH }}\target\${{ inputs.buildStage }}\release\packed\${{ inputs.packageName }}.exe"
          .\coscli.exe --secret-id $secretId --secret-key $secretKey --region $region --bucket $bucket --key $key --local $local --retries ${{ inputs.retries }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }    

      - name: 构建成功通知
        if: success()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 构建成功 ✅
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 构建失败通知
        if: failure()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: interactive
          content: |
            {
              "header": {
                "title": {"content": "❌ ${{ inputs.projectName }} 构建失败", "tag": "plain_text"},
                "template": "red"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "content": "**部署环境:** ${{ inputs.buildStage }}\n**触发分支:** ${{ github.ref_name }}\n**提交 SHA:** ${{ github.sha }}",
                    "tag": "lark_md"
                  }
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {"content": "📋 查看详情", "tag": "plain_text"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "type": "default"
                    }
                  ]
                }
              ]
            }

      - id: output
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ runner.os }}

      - name: post messasge
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 开始上传
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


      - name: update version
        if: inputs.buildStage != 'dev'
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.updateApi }}/version/update
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"platform": "windows", "env": "${{ inputs.buildStage }}", "version": "${{ needs.build_rust.outputs.version }}", "hash": "${{ github.sha }}"}'

      - name: update download
        if: inputs.buildStage == 'product'
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.updateApi }}/windows/update
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"link": "https://${{ inputs.bucket }}.cos.ap-seoul.myqcloud.com/windows/release/${{ inputs.packageName }}-${{  github.ref_name }}.exe"}'

      - name: 发布成功通知
        if: success() && inputs.buildStage != 'product'
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 发布成功 ✅
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '下载链接: '
                  - tag: text
                    text: https://${{ inputs.bucket }}.cos.ap-seoul.myqcloud.com/windows/${{ inputs.buildStage }}/${{ inputs.packageName }}-${{ github.ref_name }}-${{ github.sha }}.exe

      - name: 发布成功通知 (product)
        if: success() && inputs.buildStage == 'product'
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 加壳版本发布成功 ✅
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '下载链接: '
                  - tag: text
                    text: https://${{ inputs.bucket }}.cos.ap-seoul.myqcloud.com/windows/release/${{ inputs.packageName }}-${{  github.ref_name }}.exe
      - name: 发布成功通知 (product)
        if: success() && inputs.buildStage == 'product'
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 未加壳版本发布成功 ✅
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '下载链接: '
                  - tag: text
                    text: https://${{ inputs.bucket }}.cos.ap-seoul.myqcloud.com/windows/release/unpakced/${{ inputs.packageName }}-${{  github.ref_name }}.exe      

      - name: 发布失败通知
        if: failure()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: interactive
          content: |
            {
              "header": {
                "title": {"content": "❌ ${{ inputs.projectName }} 发布失败", "tag": "plain_text"},
                "template": "red"
              },
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "content": "**部署环境:** ${{ inputs.buildStage }}\n**触发分支:** ${{ github.ref_name }}\n**提交 SHA:** ${{ github.sha }}",
                    "tag": "lark_md"
                  }
                },
                {
                  "tag": "action",
                  "actions": [
                    {
                      "tag": "button",
                      "text": {"content": "📋 查看详情", "tag": "plain_text"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "type": "default"
                    }
                  ]
                }
              ]
            }
    outputs:
      os: ${{ steps.output.outputs.lowercase }}
      version: ${{ steps.version.outputs.version }}