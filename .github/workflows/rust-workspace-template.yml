name: Rust CI

on:
  workflow_call:
    inputs:
      projectName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      buildStage:
        required: true
        type: string
      workDir:
        required: true
        type: string
      dockerDir:
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      k8sfile:
        required: false
        type: string
        default: "k8s"
      applyOnlyWhenMissing:
        description: "仅首次创建 Deployment，已有 Deployment 只更新镜像"
        required: false
        type: boolean
        default: false
      projectPrefix:
        required: true
        type: string
      eks:
        required: false
        type: boolean
        default: false
      awsRegion:
        required: false
        type: string
      clusterName:
        required: false
        type: string
    secrets:
      webhookFeishu:
        required: true
      dockerUrl:
        required: true
      dockerRepo:
        required: true
      dockerUsername:
        required: true
      dockerPassword:
        required: true
      kubeConfig:
        required: true
      awsAccessKey:
        required: false
      awsSecretKey:
        required: false
      GH_PAT:
        required: false

jobs:
  build-rust:
    strategy:
      matrix:
        platform: [ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    env:
      tag: ${{ secrets.dockerUrl }}/${{ secrets.dockerRepo }}/${{ inputs.projectName }}:${{ inputs.buildStage }}-${{ github.sha }}

    steps:
      - name: post messasge
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 开始构建
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/checkout@v3
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - name: Install Rust
        run: rustup toolchain install stable --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install openssl
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsasl2-dev libcurl4-openssl-dev
      - name: Set up cache
        uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ./target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Enable cargo net.git-fetch-with-cli
        shell: bash
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          cat > "${CARGO_HOME:-$HOME/.cargo}/config.toml" <<'EOF'
          [net]
          git-fetch-with-cli = true
          EOF
          echo "Cargo config:"
          cat "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Use PAT for private git deps
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "ssh://github.com/"
          else
            echo "GH_PAT not set; skip private deps auth"
          fi

      - name: Build Release
        run: cargo build --release --bin ${{ inputs.packageName }}
      - name: show target
        run: ls -l target/release/
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.dockerUrl }}
          username: ${{ secrets.dockerUsername }}
          password: ${{ secrets.dockerPassword }}
      - name: Build and push Docker images
        uses: docker/build-push-action@v3.1.1
        with:
          push: true
          context: .
          file: ${{ inputs.workDir }}/${{ inputs.dockerfile }}-${{ inputs.buildStage }}
          tags: ${{ env.tag }}
      - name: post success message
        if: always()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 构建结果 ${{ job.status }}!
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '镜像tag: '
                  - tag: text
                    text: ${{ env.tag }}
  deploy_local:
    if: inputs.buildStage == 'beta'
    needs: build-rust
    runs-on: local-server
    env:
      tag: ${{ secrets.dockerUrl }}/${{ secrets.dockerRepo }}/${{ inputs.projectName }}:${{ inputs.buildStage }}-${{ github.sha }}
    steps:
      - name: post message
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 开始部署
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/checkout@v3
      - name: deploy to fellas cluster
        if: ${{ !inputs.applyOnlyWhenMissing }}
        uses: znl1087/kubectl@master
        with:
          config: ${{ secrets.kubeConfig }}
          command: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} apply -f ./${{ inputs.dockerDir}}${{ inputs.k8sfile }}-${{ inputs.buildStage }}.yaml || true
      - name: Install kubectl for first deployment mode
        if: inputs.applyOnlyWhenMissing
        uses: azure/setup-kubectl@v4
      - name: Install Python for manifest filtering
        if: inputs.applyOnlyWhenMissing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply missing Deployment and other resources
        if: inputs.applyOnlyWhenMissing
        shell: bash
        env:
          NAMESPACE: ${{ inputs.projectPrefix }}-${{ inputs.buildStage }}
          PROJECT_NAME: ${{ inputs.projectName }}
          MANIFEST: ./${{ inputs.dockerDir }}${{ inputs.k8sfile }}-${{ inputs.buildStage }}.yaml
          KUBE_CONFIG_DATA: ${{ secrets.kubeConfig }}
        run: |
          set -euo pipefail
          umask 077
          KUBECONFIG="$(mktemp)"
          export KUBECONFIG
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$KUBECONFIG"
          existing="$(kubectl --namespace="$NAMESPACE" get deployment/"$PROJECT_NAME" --ignore-not-found -o name)"
          if [ -z "$existing" ]; then
            kubectl --namespace="$NAMESPACE" apply -f "$MANIFEST"
          else
            # shortcut: 清单按单服务部署；多 Deployment 需逐个查询后过滤。
            manifest_json="$(kubectl --namespace="$NAMESPACE" create --dry-run=client -f "$MANIFEST" -o json)"
            resources="$(printf '%s' "$manifest_json" | python -c '
          import json, sys
          data = sys.stdin.read().strip()
          decoder = json.JSONDecoder()
          items = []
          while data:
              manifest, offset = decoder.raw_decode(data)
              items.extend(manifest["items"] if manifest.get("kind") == "List" else [manifest])
              data = data[offset:].lstrip()
          if not items:
              raise ValueError("kubectl returned no resources")
          resources = [item for item in items if item.get("kind") != "Deployment"]
          if resources:
              json.dump({"apiVersion": "v1", "kind": "List", "items": resources}, sys.stdout)
          ')"
            if [ -n "$resources" ]; then
              printf '%s' "$resources" | kubectl --namespace="$NAMESPACE" apply -f -
            fi
          fi
      - name: apply
        uses: znl1087/kubectl@master
        with:
          config: ${{ secrets.kubeConfig }}
          command: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} set image deployment/${{ inputs.projectName }} ${{ inputs.projectName }}=${{ env.tag }}
      - name: Wait for Deployment rollout
        if: inputs.applyOnlyWhenMissing
        uses: znl1087/kubectl@master
        with:
          config: ${{ secrets.kubeConfig }}
          command: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} rollout status deployment/${{ inputs.projectName }} --timeout=5m
      - name: post success message
        if: always()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 部署结果 ${{ job.status }}!
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '镜像tag: '
                  - tag: text
                    text: ${{ env.tag }}
  deploy_product:
    if: inputs.buildStage == 'product' && !inputs.eks
    needs: build-rust
    runs-on: ubuntu-latest
    env:
      tag: ${{ secrets.dockerUrl }}/${{ secrets.dockerRepo }}/${{ inputs.projectName }}:${{ inputs.buildStage }}-${{ github.sha }}
    steps:
      - name: post message
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 开始部署
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/checkout@v3
      - name: deploy to fellas cluster
        if: ${{ !inputs.applyOnlyWhenMissing }}
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.kubeConfig }}
          command: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} apply -f ./${{ inputs.dockerDir}}${{ inputs.k8sfile }}-${{ inputs.buildStage }}.yaml || true
      - name: Install kubectl for first deployment mode
        if: inputs.applyOnlyWhenMissing
        uses: azure/setup-kubectl@v4
      - name: Install Python for manifest filtering
        if: inputs.applyOnlyWhenMissing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply missing Deployment and other resources
        if: inputs.applyOnlyWhenMissing
        shell: bash
        env:
          NAMESPACE: ${{ inputs.projectPrefix }}-${{ inputs.buildStage }}
          PROJECT_NAME: ${{ inputs.projectName }}
          MANIFEST: ./${{ inputs.dockerDir }}${{ inputs.k8sfile }}-${{ inputs.buildStage }}.yaml
          KUBE_CONFIG_DATA: ${{ secrets.kubeConfig }}
        run: |
          set -euo pipefail
          umask 077
          KUBECONFIG="$(mktemp)"
          export KUBECONFIG
          trap 'rm -f "$KUBECONFIG"' EXIT
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$KUBECONFIG"
          existing="$(kubectl --namespace="$NAMESPACE" get deployment/"$PROJECT_NAME" --ignore-not-found -o name)"
          if [ -z "$existing" ]; then
            kubectl --namespace="$NAMESPACE" apply -f "$MANIFEST"
          else
            # shortcut: 清单按单服务部署；多 Deployment 需逐个查询后过滤。
            manifest_json="$(kubectl --namespace="$NAMESPACE" create --dry-run=client -f "$MANIFEST" -o json)"
            resources="$(printf '%s' "$manifest_json" | python -c '
          import json, sys
          data = sys.stdin.read().strip()
          decoder = json.JSONDecoder()
          items = []
          while data:
              manifest, offset = decoder.raw_decode(data)
              items.extend(manifest["items"] if manifest.get("kind") == "List" else [manifest])
              data = data[offset:].lstrip()
          if not items:
              raise ValueError("kubectl returned no resources")
          resources = [item for item in items if item.get("kind") != "Deployment"]
          if resources:
              json.dump({"apiVersion": "v1", "kind": "List", "items": resources}, sys.stdout)
          ')"
            if [ -n "$resources" ]; then
              printf '%s' "$resources" | kubectl --namespace="$NAMESPACE" apply -f -
            fi
          fi
      - name: apply
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.kubeConfig }}
          command: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} set image deployment/${{ inputs.projectName }} ${{ inputs.projectName }}=${{ env.tag }}
      - name: Wait for Deployment rollout
        if: inputs.applyOnlyWhenMissing
        uses: steebchen/kubectl@v2.0.0
        with:
          config: ${{ secrets.kubeConfig }}
          command: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} rollout status deployment/${{ inputs.projectName }} --timeout=5m
      - name: post success message
        if: always()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 部署结果 ${{ job.status }}!
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '镜像tag: '
                  - tag: text
                    text: ${{ env.tag }}

  deploy_eks:
    if: inputs.buildStage == 'product' && inputs.eks
    needs: build-rust
    runs-on: ubuntu-latest
    env:
      tag: ${{ secrets.dockerUrl }}/${{ secrets.dockerRepo }}/${{ inputs.projectName }}:${{ inputs.buildStage }}-${{ github.sha }}
      aws_region: ${{ inputs.awsRegion }}

    steps:
      - name: post message
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 开始部署
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.awsAccessKey }}
          aws-secret-access-key: ${{ secrets.awsSecretKey }}
          aws-region: ${{ env.aws_region }}
      - uses: actions/checkout@v3
      - name: create
        if: ${{ !inputs.applyOnlyWhenMissing }}
        uses: ianbelcher/eks-kubectl-action@master
        with:
          cluster_name: ${{ inputs.clusterName }}
          args: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} apply -f ./${{ inputs.dockerDir}}${{ inputs.k8sfile }}-${{ inputs.buildStage }}.yaml
      - name: Install kubectl for first deployment mode
        if: inputs.applyOnlyWhenMissing
        uses: azure/setup-kubectl@v4
      - name: Install Python for manifest filtering
        if: inputs.applyOnlyWhenMissing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply missing Deployment and other resources
        if: inputs.applyOnlyWhenMissing
        shell: bash
        env:
          NAMESPACE: ${{ inputs.projectPrefix }}-${{ inputs.buildStage }}
          PROJECT_NAME: ${{ inputs.projectName }}
          MANIFEST: ./${{ inputs.dockerDir }}${{ inputs.k8sfile }}-${{ inputs.buildStage }}.yaml
          CLUSTER_NAME: ${{ inputs.clusterName }}
        run: |
          set -euo pipefail
          umask 077
          KUBECONFIG="$(mktemp)"
          export KUBECONFIG
          trap 'rm -f "$KUBECONFIG"' EXIT
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          existing="$(kubectl --namespace="$NAMESPACE" get deployment/"$PROJECT_NAME" --ignore-not-found -o name)"
          if [ -z "$existing" ]; then
            kubectl --namespace="$NAMESPACE" apply -f "$MANIFEST"
          else
            # shortcut: 清单按单服务部署；多 Deployment 需逐个查询后过滤。
            manifest_json="$(kubectl --namespace="$NAMESPACE" create --dry-run=client -f "$MANIFEST" -o json)"
            resources="$(printf '%s' "$manifest_json" | python -c '
          import json, sys
          data = sys.stdin.read().strip()
          decoder = json.JSONDecoder()
          items = []
          while data:
              manifest, offset = decoder.raw_decode(data)
              items.extend(manifest["items"] if manifest.get("kind") == "List" else [manifest])
              data = data[offset:].lstrip()
          if not items:
              raise ValueError("kubectl returned no resources")
          resources = [item for item in items if item.get("kind") != "Deployment"]
          if resources:
              json.dump({"apiVersion": "v1", "kind": "List", "items": resources}, sys.stdout)
          ')"
            if [ -n "$resources" ]; then
              printf '%s' "$resources" | kubectl --namespace="$NAMESPACE" apply -f -
            fi
          fi
      - name: apply
        uses: ianbelcher/eks-kubectl-action@master
        with:
          cluster_name: ${{ inputs.clusterName }}
          args: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} set image deployment/${{ inputs.projectName }} ${{ inputs.projectName }}=${{ env.tag }}
      - name: Wait for Deployment rollout
        if: inputs.applyOnlyWhenMissing
        uses: ianbelcher/eks-kubectl-action@master
        with:
          cluster_name: ${{ inputs.clusterName }}
          args: --namespace=${{ inputs.projectPrefix }}-${{ inputs.buildStage }} rollout status deployment/${{ inputs.projectName }} --timeout=5m
      - name: post success message
        if: always()
        uses: foxundermoon/feishu-action@v2
        with:
          url: ${{ secrets.webhookFeishu }}
          msg_type: post
          content: |
            post:
              zh_cn:
                title: ${{ inputs.projectName }} 部署结果 ${{ job.status }}!
                content:
                - - tag: text
                    un_escape: true
                    text: '部署环境: ${{ inputs.buildStage }}'
                - - tag: text
                    text: '部署链接: '
                  - tag: a
                    text: github action
                    href: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                - - tag: text
                    text: '镜像tag: '
                  - tag: text
                    text: ${{ env.tag }}
